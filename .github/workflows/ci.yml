name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Same roles as the compose database (psql ships with the runner).
      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -d postgres://postgres:postgres@localhost:5432/kanban -f docker/init.sql

      # vitest, drizzle-kit and the test server read .env; the example's
      # localhost URLs and development passwords match the service above.
      - name: Configure environment
        run: cp .env.example .env

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm typecheck

      - run: pnpm vitest run --project unit

      - run: pnpm vitest run --project components

      - run: pnpm vitest run --project db

      - run: pnpm vitest run --project api
