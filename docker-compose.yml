services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app and its migrations run only with `docker compose --profile app up`;
  # plain `pnpm db:up` starts the database alone for local development.
  # Settings come from .env; the database URLs are overridden to reach host `db`
  # (the passwords are the development ones from docker/init.sql).
  migrate:
    profiles: [app]
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      MIGRATION_DATABASE_URL: postgres://kanban_owner:kanban_owner@db:5432/kanban
    depends_on:
      db: { condition: service_healthy }

  app:
    profiles: [app]
    build: { context: ., target: runtime }
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_DATABASE_URL: postgres://kanban_app:kanban_app@db:5432/kanban
      NUXT_AUTH_DATABASE_URL: postgres://kanban_auth:kanban_auth@db:5432/kanban
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
